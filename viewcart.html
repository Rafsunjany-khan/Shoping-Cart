<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <style>
        /* CSS for modal content layout */
        .modal-body {
            display: flex;
            flex-direction: column;
        }

        .modal-body .row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-body .row .col-name {
            flex: 0 0 50%;
            font-weight: bold;
        }

        .modal-body .row .col-quantity,
        .modal-body .row .col-price,
        .modal-body .row .col-total {
            flex: 0 0 10%;
            text-align: center;
        }

        .modal-body .row .col-price,
        .modal-body .row .col-total {
            font-weight: normal;
        }

        .modal-body .grand-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="bg-primary py-3 text-light text-center"> --- Your Cart ---</h1>

        <!-- Cart Section -->
        <div id="cart-section" class="cart-section mt-5">
            <h2>Your Cart Items</h2>
            <table class="table table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Product Image</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total Price</th>
                    </tr>
                </thead>
                <tbody id="checkout-items">
                    <!-- Cart items will be dynamically added here -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4" class="text-end"><strong>Grand Total:</strong></td>
                        <td><strong>$<span id="checkout-total">0.00</span></strong></td>
                    </tr>
                </tfoot>
            </table>

            <div class="text-center mt-4">
                <button id="clear-cart" class="btn btn-danger me-3 px-4 mb-3">Clear Cart</button>
                <button id="checkout" class="btn btn-success px-4 mb-3" data-bs-toggle="modal" data-bs-target="#checkoutModal">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="checkoutModalLabel">Checkout Summary</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- Cart details will be dynamically added here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="confirm-checkout">Confirm Checkout</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/viewcart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
