<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1 class="bg-dark py-2 text-light text-center">Your Cart</h1>

        <!-- Cart Section -->
        <div id="cart-section" class="cart-section mt-5">
            <h2>Your Cart Items</h2>
            <table class="table table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Product Image</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total Price</th>
                    </tr>
                </thead>
                <tbody id="checkout-items">
                    <!-- Cart items will be dynamically added here -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4" class="text-end"><strong>Grand Total:</strong></td>
                        <td><strong>$<span id="checkout-total">0.00</span></strong></td>
                    </tr>
                </tfoot>
            </table>

            <div class="text-center mt-4">
                <button id="clear-cart" class="btn btn-danger me-3 px-4">Clear Cart</button>
                <button id="checkout" class="btn btn-success px-4">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const checkoutItems = document.getElementById('checkout-items');
            const checkoutTotal = document.getElementById('checkout-total');

            // Display Cart Items
            function displayCart() {
                if (cart.length === 0) {
                    checkoutItems.innerHTML = '<tr><td colspan="5" class="text-center">Your cart is empty</td></tr>';
                    checkoutTotal.textContent = "0.00";
                    return;
                }

                checkoutItems.innerHTML = cart.map(item => `
                    <tr>
                        <td><img src="${item.product.image}" alt="${item.product.name}" class="img-fluid" style="width: 80px; height: 80px; object-fit: contain;"></td>
                        <td>${item.product.name}</td>
                        <td>${item.quantity}</td>
                        <td>$${item.product.price.toFixed(2)}</td>
                        <td>$${(item.product.price * item.quantity).toFixed(2)}</td>
                    </tr>
                `).join('');

                const totalPrice = cart.reduce((total, item) => total + item.product.price * item.quantity, 0);
                checkoutTotal.textContent = totalPrice.toFixed(2);
            }

            // Clear Cart
            function clearCart() {
                localStorage.removeItem('cart'); // Clear cart from localStorage
                window.location.href = 'index.html'; // Redirect to home page
            }

            // Proceed to Checkout
            function proceedToCheckout() {
                if (cart.length === 0) {
                    alert("Your cart is empty. Add items before proceeding.");
                    return;
                }
                window.location.href = 'checkoutcart.html'; // Redirect to checkout page
            }

            // Event Listeners
            document.getElementById('clear-cart').addEventListener('click', clearCart);
            document.getElementById('checkout').addEventListener('click', proceedToCheckout);

            // Initial Calls
            displayCart();
        });
    </script>

    <script src="js/script.js"></script> <!-- Load script.js at the end -->
</body>
</html>
