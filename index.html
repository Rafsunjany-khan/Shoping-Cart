<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid">
    <h1 class="bg-dark py-2 text-light text-center">Shopping Cart</h1>

    <div class="row mt-4">
        <!-- Product List Section (Col 9) -->
        <div class="col-md-9">
            <h2 class="bg-info text-dark text-center py-2">Products</h2>
            <div id="product-list" class="row">
                <!-- Product Item Template will be injected here -->
            </div>
        </div>

        <!-- Cart Section (Col 3) -->
        <div class="col-md-3">
            <h2 class="bg-info text-dark text-center py-2">Your Cart</h2>
            <div class="cart-content">
                <ul id="cart-items" class="list-group mb-3">
                    <!-- Cart items will be dynamically added here -->
                </ul>
                <p class="text-center"><strong>Total: $<span id="total-price">0.00</span></strong></p>
                <button id="clear-cart" class="btn btn-warning w-100">Clear Cart</button>
                <button id="view-cart" class="btn btn-primary w-100 mt-2">View Cart</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Product Details -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content" style="min-height: 600px;">
            <div class="modal-header">
                <h5 class="modal-title" id="productModalLabel">Product Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modalBody" style="min-height: 500px;">
                <!-- Product details will be injected here -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="js/script.js"></script>

</body>
</html>
